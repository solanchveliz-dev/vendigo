name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    # PostgreSQL temporal para las pruebas de internal/pruebas (crean y borran su propia base vendigo_pruebas).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vendigo
          POSTGRES_PASSWORD: vendigo
          POSTGRES_DB: vendigo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vendigo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_PRUEBAS: postgres://vendigo:vendigo@localhost:5432/vendigo?sslmode=disable
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: api/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          API_URL: http://localhost:8080

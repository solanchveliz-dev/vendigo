services:
  db:
    image: postgis/postgis:16-3.4
    container_name: vendigo-db
    environment:
      POSTGRES_USER: vendigo
      POSTGRES_PASSWORD: vendigo
      POSTGRES_DB: vendigo
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  storage:
    image: minio/minio:latest
    container_name: vendigo-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vendigo
      MINIO_ROOT_PASSWORD: vendigo123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage_data:/data

  storage-init:
    image: minio/mc:latest
    depends_on:
      - storage
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://storage:9000 vendigo vendigo123;
      mc mb -p local/vendigo-publico;
      mc mb -p local/vendigo-privado;
      mc anonymous set download local/vendigo-publico;
      exit 0;
      "

volumes:
  db_data:
  storage_data:

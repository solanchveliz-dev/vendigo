# Servicios locales para desarrollo: PostgreSQL y almacenamiento compatible con S3.
# Los buckets los crea la API al iniciar (solo en local).
services:
  db:
    image: postgres:16
    container_name: vendigo-db
    environment:
      POSTGRES_USER: vendigo
      POSTGRES_PASSWORD: vendigo
      POSTGRES_DB: vendigo
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  storage:
    image: cgr.dev/chainguard/minio:latest
    container_name: vendigo-storage
    user: "0:0"
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: vendigo
      MINIO_ROOT_PASSWORD: vendigo123
    ports:
      - "9000:9000"
    volumes:
      - storage_data:/data

volumes:
  db_data:
  storage_data: